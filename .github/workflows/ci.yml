name: CI

# Fast checks only. The Windows installer build lives in installer.yml and runs
# by hand, because Windows runners use GitHub Actions minutes twice as fast.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (downloads Live2D Cubism Core)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (web)
        run: npm test
