name: CI

# Fast checks only. The Windows installer build lives in installer.yml.
# Runs only when started by hand (Actions tab > CI > Run workflow): Actions
# minutes are limited, so changes are checked with local builds instead.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (downloads Live2D Cubism Core)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (web)
        run: npm test
