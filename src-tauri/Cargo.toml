[package]
name = "desktop-assistant"
version = "0.1.0"
description = "A Claude-powered Live2D desktop companion"
edition = "2021"

[lib]
name = "desktop_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }
ort-sys = { version = "=2.0.0-rc.9", default-features = false }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tauri-plugin-global-shortcut = "2"
whisper-rs = "0.16"
tokio = { version = "1", features = ["sync", "process", "io-util"] }

[target.'cfg(windows)'.dependencies]
# DirectML lets the native voice run on the GPU (settings voice_device "gpu").
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "directml"] }
