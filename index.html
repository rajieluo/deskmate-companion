<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Assistant</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Live2D Cubism Core (proprietary, fetched by scripts/fetch-cubism-core.mjs) -->
    <script src="/vendor/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="stage3d" hidden></canvas>
    <div id="bubble" hidden><p id="bubble-text"></p><p id="bubble-activity" hidden></p></div>
    <div id="poses" hidden></div>
    <form id="chat" hidden autocomplete="off">
      <button id="toolbar-grip" type="button" title="Drag to move the chat box (double-click: back to the middle)" aria-label="Move the chat box">
        <svg viewBox="0 0 10 16" width="8" height="14" aria-hidden="true">
          <circle cx="2.5" cy="3" r="1.4" fill="currentColor"/><circle cx="7.5" cy="3" r="1.4" fill="currentColor"/>
          <circle cx="2.5" cy="8" r="1.4" fill="currentColor"/><circle cx="7.5" cy="8" r="1.4" fill="currentColor"/>
          <circle cx="2.5" cy="13" r="1.4" fill="currentColor"/><circle cx="7.5" cy="13" r="1.4" fill="currentColor"/>
        </svg>
      </button>
      <input id="chat-input" type="text" placeholder="Talk to Aqua…" maxlength="2000" />
      <button id="mic" type="button" title="Speak" aria-label="Speak">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/>
        </svg>
      </button>
      <button id="mute" type="button" title="Mute her voice" aria-label="Mute" aria-pressed="false">
        <svg class="on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3Zm13.5 2A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4ZM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/>
        </svg>
        <svg class="off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3Zm13.6 2 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4-2.7-2.7Z"/>
        </svg>
      </button>
      <button id="poses-btn" type="button" title="Poses, animations and voice" aria-label="Poses, animations and voice">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm-7 6h14v2h-5v12h-2v-6h-0v6h-2V10H5V8Z"/>
        </svg>
      </button>
      <button id="history-btn" type="button" title="Chat history" aria-label="Chat history">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L9 12H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3Zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8H12Z"/>
        </svg>
      </button>
    </form>
    <form id="api-key" hidden autocomplete="off">
      <input id="api-key-input" type="password" placeholder="sk-ant-…" />
      <button type="submit">Save</button>
    </form>
    <div id="crew" hidden></div>
    <div id="crew-card" hidden></div>
    <div id="status" hidden>
      <p id="status-text"></p>
      <button id="status-pick" type="button" hidden>Choose model…</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
