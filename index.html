<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Assistant</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Live2D Cubism Core (proprietary, fetched by scripts/fetch-cubism-core.mjs) -->
    <script src="/vendor/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubble" hidden><p id="bubble-text"></p></div>
    <form id="chat" hidden autocomplete="off">
      <input id="chat-input" type="text" placeholder="Talk to Aqua…" maxlength="2000" />
      <button id="mic" type="button" title="Speak (Ctrl+Shift+M)" aria-label="Speak">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/>
        </svg>
      </button>
    </form>
    <form id="api-key" hidden autocomplete="off">
      <input id="api-key-input" type="password" placeholder="sk-ant-…" />
      <button type="submit">Save</button>
    </form>
    <div id="status" hidden>
      <p id="status-text"></p>
      <button id="status-pick" type="button" hidden>Choose model…</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
